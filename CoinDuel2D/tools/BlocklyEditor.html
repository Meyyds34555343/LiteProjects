<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoinDuel2D — Blockly Mod Editor</title>
  <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/msg/en.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <style>
    :root {
      --bg: #14181f;
      --panel: #1c2330;
      --line: #2c3648;
      --text: #e8eef8;
      --muted: #9aa8bd;
      --accent: #5ec8ff;
      --ok: #6bcf7f;
      --warn: #f0c14a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; }
    header {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
    header .hint { color: var(--muted); font-size: 0.82rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    button, .file-btn {
      appearance: none; border: 1px solid var(--line); background: #243044; color: var(--text);
      border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer;
    }
    button:hover, .file-btn:hover { border-color: var(--accent); }
    button.primary { background: #1f4d6b; border-color: #3a7ea8; }
    button.ok { background: #1f4a32; border-color: #3d8a55; }
    #main {
      display: grid; grid-template-columns: 1fr minmax(260px, 320px);
      min-height: 0; height: 100%;
    }
    @media (max-width: 900px) {
      #main { grid-template-columns: 1fr; grid-template-rows: 1fr 280px; }
    }
    #workspace { width: 100%; height: 100%; min-height: 320px; }
    #previewPane {
      border-left: 1px solid var(--line); background: #121820;
      display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
    }
    #previewPane .title {
      padding: 10px 12px 6px; font-size: 0.78rem; color: var(--accent);
      letter-spacing: 0.06em; font-weight: 700;
    }
    #previewWrap { position: relative; min-height: 0; }
    #previewCanvas { width: 100%; height: 100%; display: block; }
    #previewStats {
      padding: 8px 12px 12px; font-size: 0.72rem; color: var(--muted);
      border-top: 1px solid var(--line); line-height: 1.45;
    }
    #previewStats strong { color: var(--text); font-weight: 600; }
    footer {
      border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px;
      display: grid; gap: 8px;
    }
    footer label { font-size: 0.78rem; color: var(--muted); }
    textarea {
      width: 100%; min-height: 72px; resize: vertical; border-radius: 8px;
      border: 1px solid var(--line); background: #0f131a; color: var(--text);
      font-family: Consolas, "Courier New", monospace; font-size: 0.78rem; padding: 8px;
    }
    #status { font-size: 0.8rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: #ff8a8a; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .meta input {
      background: #0f131a; border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 140px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CoinDuel2D Blockly Mod Editor</h1>
    <span class="hint">Web-first: design here → Copy COINMOD1 → open runtime (no Cocos rebuild)</span>
    <div class="meta">
      <input id="modName" placeholder="Mod name" value="Blockly Mode" />
      <input id="modAuthor" placeholder="Author" value="" />
      <input id="uiWin" placeholder="UI: win text" value="" title="uiStrings.win" />
      <input id="uiLose" placeholder="UI: lose text" value="" title="uiStrings.lose" />
    </div>
    <div class="actions">
      <button class="ok" id="btnCopyShare" title="Primary CTA">Copy COINMOD1</button>
      <button class="primary" id="btnOpenRuntime">Open in Runtime</button>
      <button id="btnExportShare">Export Share</button>
      <button id="btnExportJson">Mod JSON</button>
      <button id="btnExportLevel">Level JSON</button>
      <button id="btnExportWs">Workspace</button>
      <button id="btnImportShare">Import</button>
      <button id="btnLoadLevel1" title="Fetch cdn/levels/1.json into blocks">Load Level 1</button>
      <button id="btnCopyJson">Copy JSON</button>
      <button id="btnClear">Clear</button>
    </div>
  </header>
  <div id="main">
    <div id="workspace"></div>
    <aside id="previewPane">
      <div class="title">LIVE PREVIEW <span id="parityBadge" style="color:#9aa8bd;font-weight:500;letter-spacing:0;margin-left:8px;"></span></div>
      <div id="previewWrap"><canvas id="previewCanvas"></canvas></div>
      <div style="display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--line);">
        <button type="button" id="btnPrevPlay" style="flex:1;padding:5px;">Play</button>
        <button type="button" id="btnPrevPause" style="flex:1;padding:5px;">Pause</button>
        <button type="button" id="btnPrevReset" style="flex:1;padding:5px;">Reset</button>
      </div>
      <div id="memeCatalog" style="max-height:88px;overflow:auto;padding:6px 10px;font-size:0.72rem;color:var(--muted);border-top:1px solid var(--line);"></div>
      <div id="previewStats">Edit blocks → table / physics update instantly. Drag striker to aim-shot.</div>
    </aside>
  </div>
  <footer>
    <label for="io">Share code / JSON / workspace string</label>
    <textarea id="io" placeholder="Paste COINMOD1:… or COINWS1:… here, then Import"></textarea>
    <div id="status">Ready — drag Events (yellow) hats, then Conditions / Actions / FX.</div>
  </footer>

    /* ── Inlined CoinDuel Blockly defs (mirrors BlocklyDefinitions.ts) ── */

    const TYPE_TO_OP = {

      { type: 'math_random', message0: 'random %2..%3 → %1', args0: [{ type: 'field_input', name: 'NAME', text: 'ExplosionPower' }, { type: 'field_number', name: 'MIN', value: 1 }, { type: 'field_number', name: 'MAX', value: 100 }], previousStatement: null, nextStatement: null, colour: H.rules },
      { type: 'config_win_clear_all', message0: 'WIN rule: clear all coins', colour: H.rules },
      { type: 'config_win_score', message0: 'WIN rule: reach score %1', args0: [{ type: 'field_number', name: 'SCORE', value: 100 }], colour: H.rules },

      { type: 'config_physics', message0: 'physics friction %1 restitution %2 time-reverse %3 aim %4', args0: [{ type: 'field_number', name: 'FRICTION', value: 0.35, min: 0, max: 1 }, { type: 'field_number', name: 'RESTITUTION', value: 1, min: 0, max: 2 }, { type: 'field_dropdown', name: 'TIME_REVERSE', options: [['ON','true'],['OFF','false']] }, { type: 'field_number', name: 'AIM', value: 1, min: 0.1, max: 3 }], colour: H.rules },
      { type: 'level_setup', message0: 'level id %1 size %2 x %3 wall %4', args0: [{ type: 'field_number', name: 'ID', value: 1, min: 1 }, { type: 'field_number', name: 'WIDTH', value: 800, min: 200 }, { type: 'field_number', name: 'HEIGHT', value: 600, min: 200 }, { type: 'field_number', name: 'WALL', value: 64, min: 8 }], colour: H.level },
      { type: 'level_place', message0: 'place %1 at x %2 y %3 r %4 class %5 skin %6 url %7 meme %8 mudμ %9', args0: [
        { type: 'field_dropdown', name: 'KIND', options: [['出手币 striker','striker'],['目标币 target','target'],['击退 knockback','knockback'],['冰冻 freeze','freeze'],['闪身 flash','flash'],['炸弹 bomb','bomb'],['障碍 block','block'],['泥地 mud','mud']] },
        { type: 'field_number', name: 'X', value: 0 }, { type: 'field_number', name: 'Y', value: 0 },
        { type: 'field_number', name: 'RADIUS', value: 32, min: 8 }, { type: 'field_number', name: 'CLASS', value: 1, min: 1, max: 20 },
        { type: 'field_dropdown', name: 'SKIN', options: [['(none)',''],['gold','gold'],['silver','silver'],['copper','copper'],['ice','ice'],['coin_1','coin_1'],['coin_2','coin_2']] },
        { type: 'field_input', name: 'URL', text: '' }, { type: 'field_input', name: 'MEME', text: '' },

      ], colour: H.level },

    ];

    const TOOLBOX = {
      kind: 'categoryToolbox',
      contents: [
        { kind: 'category', name: '🟢 Level', colour: String(H.level), contents: ['level_setup','level_place','level_table_skin'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '🟡 Events', colour: String(H.event), contents: ['when_game_start','when_coin_hit','when_cushion_bounce','when_power_charged','when_foul_triggered','when_timer_tick','when_shot_fired'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '🔵 Conditions', colour: String(H.condition), contents: ['if_velocity_gt','if_coin_tag','if_probability','if_coins_left_lt','if_var_gt'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '🟣 Actions', colour: String(H.action), contents: ['apply_impulse','explode_radius','swap_positions','set_coin_position','change_friction','trigger_time_reverse','set_variable','change_variable','tag_coin','declare_win','declare_lose'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '🔴 Juice FX', colour: String(H.fx), contents: ['play_meme_sound','spawn_world_text','show_coin_position','apply_squash_stretch','screen_shake'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '🎨 Skins', colour: String(H.skin), contents: ['set_coin_skin','set_table_skin'].map((t) => ({ kind: 'block', type: t })) },
        { kind: 'category', name: '⚙ Rules / Math', colour: String(H.rules), contents: ['config_win_clear_all','config_win_score','config_win_survive','config_win_boss','config_lose_striker_fall','config_lose_shot_limit','config_lose_timer','config_physics','math_add','math_sub','math_random'].map((t) => ({ kind: 'block', type: t })) },
      ],
    };

    function propsFrom(block) {
      const map = FIELD_MAP[block.type] || {};
      const out = {};
      for (const [field, key] of Object.entries(map)) {
        const raw = block.getFieldValue(field);
        if (raw === null || raw === undefined) continue;
        if (typeof raw === 'string' && /^-?\d+(\.\d+)?$/.test(raw)) out[key] = Number(raw);
        else if (raw === 'true') out[key] = true;
        else if (raw === 'false') out[key] = false;
        else out[key] = raw;
      }
      return out;
    }

    function walkStack(hat) {
      const out = [hat];
      let cur = hat.getNextBlock();
      let g = 0;
      while (cur && g++ < 128) { out.push(cur); cur = cur.getNextBlock(); }
      return out;
    }

    function hashText(text) {
      let h = 2166136261;
      for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16).padStart(8, '0');
    }

    function placeToItem(kind, x, y, radius, extra) {
      extra = extra || {};
      var cls = extra.classId || 1;
      var skinBits = {};
      if (extra.skin) skinBits.skinKey = extra.skin;
      if (extra.url) skinBits.skin = { default: extra.url, idle: extra.url };
      if (extra.meme) skinBits.memeId = extra.meme;
      if (kind === 'striker') return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: true, radius: radius }, skinBits);
      if (kind === 'target') return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: false, radius: radius }, skinBits);
      if (kind === 'knockback') return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: false, radius: radius, behavior: 'KnockbackBehavior', behaviors: ['KnockbackBehavior'] }, skinBits);
      if (kind === 'freeze') return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: false, radius: radius, behavior: 'FreezeBehavior', behaviors: ['FreezeBehavior'] }, skinBits);
      if (kind === 'flash') return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: false, radius: radius, behavior: 'FlashStepBehavior', behaviors: ['FlashStepBehavior'] }, skinBits);
      if (kind === 'bomb') return Object.assign({ type: 'bomb', class: cls, x: x, y: y, radius: radius }, skinBits);
      if (kind === 'block') return { type: 'block', x: x, y: y, shape: 'circle', radius: radius };
      if (kind === 'mud') return { type: 'mud', x: x, y: y, shape: 'circle', radius: radius, friction: extra.friction != null ? extra.friction : 0.5 };
      return Object.assign({ type: 'coin', class: cls, x: x, y: y, canshot: false, radius: radius }, skinBits);
    }

    function workspaceToMod(ws) {
      const tops = ws.getTopBlocks(true);
      const pipelines = [];
      const graphBlocks = [];
      const win = [];
      const lose = [];
      let physics = { tableFriction: 0.35, restitutionScale: 1, enableTimeReversePenalty: true, aimPowerScale: 1 };
      const varNames = new Set(['KarmaPoints', 'ExplosionPower']);
      const levelDraft = { id: 1, width: 800, height: 600, wall: 64, coins: [], felt: '', wallSkin: '' };
      let hasLevel = false;

      for (const top of tops) {
        if (top.type.startsWith('config_')) {
          if (top.type === 'config_win_clear_all') win.push({ type: 'CLEAR_ALL_COINS' });
          else if (top.type === 'config_win_score') win.push({ type: 'REACH_TARGET_SCORE', value: Number(top.getFieldValue('SCORE') || 100) });
          else if (top.type === 'config_win_survive') win.push({ type: 'SURVIVE_TIME_LIMIT', value: Number(top.getFieldValue('SEC') || 60) });
          else if (top.type === 'config_win_boss') win.push({ type: 'KNOCK_OUT_BOSS_COIN', value: String(top.getFieldValue('TAG') || 'boss') });
          else if (top.type === 'config_lose_striker_fall') lose.push({ type: 'STRIKER_FALLS_OFF_TABLE' });
          else if (top.type === 'config_lose_shot_limit') lose.push({ type: 'SHOT_LIMIT', value: Number(top.getFieldValue('COUNT') || 10) });
          else if (top.type === 'config_lose_timer') lose.push({ type: 'TIMER_EXPIRED', value: Number(top.getFieldValue('SEC') || 90) });
          else if (top.type === 'config_physics') {
            physics = {
              tableFriction: Number(top.getFieldValue('FRICTION') || 0.35),
              restitutionScale: Number(top.getFieldValue('RESTITUTION') || 1),
              enableTimeReversePenalty: String(top.getFieldValue('TIME_REVERSE')) !== 'false',
              aimPowerScale: Number(top.getFieldValue('AIM') || 1),
            };
          }
          continue;
        }
        if (top.type.startsWith('level_')) {
          hasLevel = true;
          if (top.type === 'level_setup') {
            levelDraft.id = Number(top.getFieldValue('ID') || 1);
            levelDraft.width = Number(top.getFieldValue('WIDTH') || 800);
            levelDraft.height = Number(top.getFieldValue('HEIGHT') || 600);
            levelDraft.wall = Number(top.getFieldValue('WALL') || 64);
          } else if (top.type === 'level_table_skin') {
            levelDraft.felt = String(top.getFieldValue('FELT') || 'table_1');
            levelDraft.wallSkin = String(top.getFieldValue('WALL') || 'wall_1');
          } else if (top.type === 'level_place') {
            levelDraft.coins.push(placeToItem(
              String(top.getFieldValue('KIND') || 'target'),
              Number(top.getFieldValue('X') || 0),
              Number(top.getFieldValue('Y') || 0),
              Number(top.getFieldValue('RADIUS') || 32),
              {
                classId: Number(top.getFieldValue('CLASS') || 1),
                skin: String(top.getFieldValue('SKIN') || ''),
                url: String(top.getFieldValue('URL') || ''),
                meme: String(top.getFieldValue('MEME') || ''),
                friction: Number(top.getFieldValue('FRICTION') || 0.5)
              }
            ));
          }
          continue;
        }
        if (!EVENTS.has(top.type)) continue;
        const eventOp = TYPE_TO_OP[top.type];
        const chain = walkStack(top);
        const eventProps = propsFrom(top);
        const steps = [];
        let prevId = null;
        for (let i = 0; i < chain.length; i++) {
          const b = chain[i];
          const opcode = TYPE_TO_OP[b.type];
          if (!opcode) continue;
          const props = propsFrom(b);
          const id = b.id || ('b_' + i);
          const visual = {
            id, opcode, nextId: null,
            props: Object.keys(props).map((k) => ({ key: k, label: k, value: props[k] })),
            x: -40, y: 120 - i * 40,
          };
          if (prevId) {
            const prev = graphBlocks.find((g) => g.id === prevId);
            if (prev) prev.nextId = id;
          }
          graphBlocks.push(visual);
          prevId = id;
          if (i === 0) continue;
          steps.push({ opcode, props });
          if (typeof props.name === 'string') varNames.add(props.name);
        }
        const pipe = { id: top.id || ('pipe_' + pipelines.length), event: eventOp, steps };
        if (Object.keys(eventProps).length) pipe.eventProps = eventProps;
        pipelines.push(pipe);
      }

      if (!win.length) win.push({ type: 'CLEAR_ALL_COINS' });
      if (!lose.length) lose.push({ type: 'STRIKER_FALLS_OFF_TABLE' });

      const uiStrings = {};
      const winText = (document.getElementById('uiWin') && document.getElementById('uiWin').value || '').trim();
      const loseText = (document.getElementById('uiLose') && document.getElementById('uiLose').value || '').trim();
      if (winText) uiStrings.win = winText;
      if (loseText) uiStrings.lose = loseText;

      const mod = {
        schemaVersion: 1,
        id: 'mod_' + Date.now().toString(36),
        name: document.getElementById('modName').value || 'Blockly Mode',
        author: document.getElementById('modAuthor').value || undefined,
        version: Date.now(),
        graph: { blocks: graphBlocks },
        pipelines,
        win, lose, physics,
        variables: Array.from(varNames).map((name) => ({
          name, initial: name === 'ExplosionPower' ? 50 : 0,
        })),
        assetManifestUrl: CDN_MANIFEST,
        boot: { scene: 'game', autoPlay: true },
      };
      if (Object.keys(uiStrings).length) mod.uiStrings = uiStrings;
      if (hasLevel) {
        mod.level = {
          id: levelDraft.id,
          width: levelDraft.width,
          height: levelDraft.height,
          wall: { thickness: levelDraft.wall },
          coins: levelDraft.coins,
        };
        if (levelDraft.felt || levelDraft.wallSkin) {
          mod.level.table = {};
          if (levelDraft.felt) mod.level.table.felt = levelDraft.felt;
          if (levelDraft.wallSkin) mod.level.table.wall = levelDraft.wallSkin;
        }
      }
      const raw = JSON.stringify(mod);
      mod.hash = hashText(raw);
      return mod;
    }

    function validateMod(mod) {
      const errs = [];
      const coins = (mod.level && mod.level.coins) || [];
      const hasStriker = coins.some(function (c) { return c.type === 'coin' && c.canshot !== false && !(c.behaviors && c.behaviors[0]); })
        || coins.some(function (c) { return c.canshot === true; });
      if (mod.level && coins.length && !hasStriker) errs.push('No striker (canshot coin) in level');
      if (!mod.win || !mod.win.length) errs.push('No WIN rule');
      const known = window.__cdnMemeIds;
      if (known && known.length) {
        coins.forEach(function (c) {
          if (c.memeId && known.indexOf(String(c.memeId)) < 0) errs.push('Unknown memeId: ' + c.memeId);
        });
      }
      return errs;
    }

    function toShare(mod) {
      const json = JSON.stringify(mod);
      return 'COINMOD1:' + btoa(unescape(encodeURIComponent(json)));
    }

    function fromShare(code) {
      const t = code.trim();
      if (!t.startsWith('COINMOD1:')) return null;
      try {
        const json = decodeURIComponent(escape(atob(t.slice(8))));
        const data = JSON.parse(json);
        if (data.schemaVersion !== 1 || !Array.isArray(data.pipelines)) return null;
        return data;
      } catch { return null; }
    }

    function compress(text) {
      if (window.LZString) return 'lz:' + LZString.compressToBase64(text);
      return 'b64:' + btoa(unescape(encodeURIComponent(text)));
    }
    function decompress(payload) {
      try {
        if (payload.startsWith('lz:') && window.LZString) return LZString.decompressFromBase64(payload.slice(3));
        if (payload.startsWith('b64:')) return decodeURIComponent(escape(atob(payload.slice(4))));
        return decodeURIComponent(escape(atob(payload)));
      } catch { return null; }
    }

    function setStatus(msg, kind) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = kind || '';
    }

    /* ── Live preview sandbox (mirrors LivePreviewSandbox.ts) ── */
    const previewCanvas = document.getElementById('previewCanvas');
    const previewStats = document.getElementById('previewStats');
    const pctx = previewCanvas.getContext('2d');
    let liveMod = null;
    let liveTimer = null;
    let t0 = performance.now();
    let simBodies = [];
    let simPlaying = true;
    let simDragging = false;
    let simDragFrom = null;
    let simDragTo = null;
    let simView = { cx: 0, cy: 0, scale: 1 };
    let memeAtlas = {};
    window.__cdnMemeIds = [];

    function frictionToDamping(friction) { return Math.max(0.05, friction * 6); }

    function resetSimFromMod(mod) {
      const m = extractMarkers(mod);
      simBodies = m.coins.map(function (c) {
        return {
          x: c.x, y: c.y, vx: 0, vy: 0,
          r: 32, kind: c.kind || 'target', label: c.label || '',
          memeId: c.memeId, canshot: c.kind === 'striker'
        };
      });
      simDragging = false; simDragFrom = null; simDragTo = null;
    }

    function screenToWorld(clientX, clientY) {
      const rect = previewCanvas.getBoundingClientRect();
      const sx = clientX - rect.left, sy = clientY - rect.top;
      return { x: (sx - simView.cx) / simView.scale, y: -((sy - simView.cy) / simView.scale) };
    }

    previewCanvas.addEventListener('pointerdown', function (e) {
      const w = screenToWorld(e.clientX, e.clientY);
      const striker = simBodies.find(function (b) { return b.canshot || b.kind === 'striker'; });
      if (!striker) return;
      if (Math.hypot(w.x - striker.x, w.y - striker.y) > 28) return;
      simDragging = true; simDragFrom = { x: striker.x, y: striker.y }; simDragTo = w;
      try { previewCanvas.setPointerCapture(e.pointerId); } catch (_) {}
    });
    window.addEventListener('pointermove', function (e) {
      if (!simDragging) return;
      simDragTo = screenToWorld(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', function (e) {
      if (!simDragging || !simDragFrom || !simDragTo) { simDragging = false; return; }
      const striker = simBodies.find(function (b) { return b.canshot || b.kind === 'striker'; });
      if (striker) {
        const aim = (liveMod && liveMod.physics && liveMod.physics.aimPowerScale) || 1;
        striker.vx += (simDragFrom.x - simDragTo.x) * 8 * aim;
        striker.vy += (simDragFrom.y - simDragTo.y) * 8 * aim;
        simPlaying = true;
      }
      simDragging = false; simDragFrom = null; simDragTo = null;
    });

    function stepSim(dt) {
      if (!simPlaying || !liveMod) return;
      const phys = liveMod.physics || {};
      const damping = frictionToDamping(phys.tableFriction != null ? phys.tableFriction : 0.35);
      const rest = phys.restitutionScale != null ? phys.restitutionScale : 1;
      const m = extractMarkers(liveMod);
      const hw = m.tableW / 2, hh = m.tableH / 2;
      const wall = ((liveMod.level && liveMod.level.wall && liveMod.level.wall.thickness) || 64) * 0.5;
      const decay = Math.max(0, 1 - damping * dt * 0.35);
      for (const b of simBodies) {
        if (b.kind === 'block' || b.kind === 'mud') continue;
        b.vx *= decay; b.vy *= decay;
        b.x += b.vx * dt; b.y += b.vy * dt;
        const rr = 14;
        const minX = -hw + wall + rr, maxX = hw - wall - rr;
        const minY = -hh + wall + rr, maxY = hh - wall - rr;
        if (b.x < minX) { b.x = minX; b.vx = Math.abs(b.vx) * rest; }
        if (b.x > maxX) { b.x = maxX; b.vx = -Math.abs(b.vx) * rest; }
        if (b.y < minY) { b.y = minY; b.vy = Math.abs(b.vy) * rest; }
        if (b.y > maxY) { b.y = maxY; b.vy = -Math.abs(b.vy) * rest; }
      }
      for (let i = 0; i < simBodies.length; i++) {
        for (let j = i + 1; j < simBodies.length; j++) {
          const a = simBodies[i], b = simBodies[j];
          if (a.kind === 'mud' || b.kind === 'mud') continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.0001;
          const minD = 28;
          if (dist >= minD) continue;
          const nx = dx / dist, ny = dy / dist, overlap = minD - dist;
          const aStatic = a.kind === 'block', bStatic = b.kind === 'block';
          if (!aStatic && !bStatic) { a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5; b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5; }
          else if (!aStatic) { a.x -= nx * overlap; a.y -= ny * overlap; }
          else if (!bStatic) { b.x += nx * overlap; b.y += ny * overlap; }
          const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vn > 0) continue;
          const jImp = -(1 + rest) * vn / ((aStatic ? 0 : 1) + (bStatic ? 0 : 1) || 1);
          if (!aStatic) { a.vx -= jImp * nx; a.vy -= jImp * ny; }
          if (!bStatic) { b.vx += jImp * nx; b.vy += jImp * ny; }
        }
      }
    }

    function feltColor(mod) {
      let felt = (mod && mod.level && mod.level.table && mod.level.table.felt) || 'table_1';
      for (const pipe of (mod && mod.pipelines) || []) {
        for (const step of pipe.steps || []) {
          if (step.opcode === 'SET_TABLE_SKIN' && step.props && step.props.felt) felt = step.props.felt;
        }
      }
      return ({ table_1: '#1b5e20', board: '#2e7d32', board1: '#33691e', board2: '#1b5e4a', bg1: '#37474f' })[felt] || '#1b5e20';
    }

    function extractMarkers(mod) {
      const coins = [], blasts = [], impulses = [];
      let idx = 0;
      const tableW = (mod && mod.level && mod.level.width) || 800;
      const tableH = (mod && mod.level && mod.level.height) || 600;
      if (mod && mod.level && mod.level.coins) {
        for (const item of mod.level.coins) {
          const type = item.type || 'coin';
          let label = type, kind = type;
          if (type === 'coin') {
            if (item.canshot !== false) { label = 'striker'; kind = 'striker'; }
            else if ((item.behaviors || [])[0]) { label = String(item.behaviors[0]).replace('Behavior',''); kind = label.toLowerCase(); }
            else { label = 'target'; kind = 'target'; }
          }
          coins.push({ x: +item.x || 0, y: +item.y || 0, label: label, kind: kind, memeId: item.memeId ? String(item.memeId) : undefined });
        }
      }
      for (const pipe of (mod && mod.pipelines) || []) {
        for (const step of pipe.steps || []) {
          const p = step.props || {};
          if (step.opcode === 'SET_COIN_POSITION') coins.push({ x: +p.x || 0, y: +p.y || 0, label: 'P' + (++idx), kind: 'runtime' });
          if (step.opcode === 'EXPLODE_RADIUS') {
            const o = coins[coins.length - 1] || { x: 0, y: 0 };
            blasts.push({ x: o.x, y: o.y, radius: +p.radius || 120 });
          }
          if (step.opcode === 'APPLY_IMPULSE') {
            const o = coins[coins.length - 1] || { x: 0, y: 0 };
            impulses.push({ x: o.x, y: o.y, ix: +p.x || 0, iy: +p.y || 0 });
          }
        }
      }
      if (!coins.length) {
        coins.push({ x: -120, y: 0, label: 'striker', kind: 'striker' });
        coins.push({ x: 80, y: 40, label: 'target', kind: 'target' });
        coins.push({ x: 140, y: -30, label: 'target', kind: 'target' });
      }
      return { coins, blasts, impulses, tableW, tableH };
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function resizePreview() {
      const wrap = document.getElementById('previewWrap');
      const w = wrap.clientWidth || 280;
      const h = wrap.clientHeight || 360;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      previewCanvas.width = Math.floor(w * dpr);
      previewCanvas.height = Math.floor(h * dpr);
      previewCanvas.style.width = w + 'px';
      previewCanvas.style.height = h + 'px';
      pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawPreview();
    }

    function drawPreview() {
      const w = previewCanvas.clientWidth || 280;
      const h = previewCanvas.clientHeight || 360;
      const ctx = pctx;
      ctx.clearRect(0, 0, w, h);
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#1a2433'); bg.addColorStop(1, '#10161f');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      const markers = extractMarkers(liveMod);
      const tableW = markers.tableW || 800, tableH = markers.tableH || 600, cx = w / 2, cy = h * 0.42;
      const scale = Math.min((w - 32) / tableW, (h * 0.55) / tableH);
      const phys = (liveMod && liveMod.physics) || {};
      const friction = phys.tableFriction != null ? phys.tableFriction : 0.35;

      ctx.save();
      ctx.translate(cx, cy); ctx.scale(scale, scale);
      ctx.fillStyle = feltColor(liveMod);
      roundRect(ctx, -tableW / 2, -tableH / 2, tableW, tableH, 18); ctx.fill();
      ctx.strokeStyle = '#6d4c2f';
      ctx.lineWidth = Math.max(8, ((liveMod && liveMod.level && liveMod.level.wall && liveMod.level.wall.thickness) || 64) * 0.25);
      roundRect(ctx, -tableW / 2, -tableH / 2, tableW, tableH, 18); ctx.stroke();
      if (friction < 0.2) { ctx.fillStyle = 'rgba(180,230,255,0.18)'; roundRect(ctx, -tableW / 2, -tableH / 2, tableW, tableH, 18); ctx.fill(); }
      else if (friction > 0.55) { ctx.fillStyle = 'rgba(90,60,30,0.22)'; roundRect(ctx, -tableW / 2, -tableH / 2, tableW, tableH, 18); ctx.fill(); }
      const pulse = 0.5 + 0.5 * Math.sin((performance.now() - t0) / 400);
      for (const b of markers.blasts) {
        ctx.beginPath(); ctx.arc(b.x, -b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,112,67,' + (0.25 + 0.35 * pulse) + ')'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255,112,67,' + (0.08 + 0.06 * pulse) + ')'; ctx.fill();
      }
      for (const imp of markers.impulses) {
        const len = Math.min(80, Math.hypot(imp.ix, imp.iy) * 0.05 + 20);
        const ang = Math.atan2(-imp.iy, imp.ix);
        ctx.strokeStyle = '#ce93d8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(imp.x, -imp.y);
        ctx.lineTo(imp.x + Math.cos(ang) * len, -imp.y + Math.sin(ang) * len); ctx.stroke();
      }
      const bodies = simBodies.length ? simBodies : markers.coins.map(function (c) {
        return { x: c.x, y: c.y, kind: c.kind, label: c.label, memeId: c.memeId };
      });
      for (const c of bodies) {
        const img = c.memeId && memeAtlas[c.memeId];
        if (img) {
          try { ctx.drawImage(img, c.x - 16, -c.y - 16, 32, 32); } catch (_) {}
        } else {
          ctx.beginPath(); ctx.arc(c.x, -c.y, 14, 0, Math.PI * 2);
          ctx.fillStyle = (c.kind === 'striker' || c.label === 'striker') ? '#ffe082'
            : c.kind === 'freeze' ? '#81d4fa' : c.kind === 'flash' ? '#aed581' : c.kind === 'bomb' ? '#ef5350' : '#eceff1';
          ctx.fill();
          ctx.strokeStyle = '#263238'; ctx.lineWidth = 2; ctx.stroke();
        }
        if (c.label) { ctx.fillStyle = '#fffde7'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.label, c.x, -c.y - 20); }
      }
      if (simDragging && simDragFrom && simDragTo) {
        ctx.strokeStyle = '#5ec8ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(simDragFrom.x, -simDragFrom.y); ctx.lineTo(simDragTo.x, -simDragTo.y); ctx.stroke();
      }
      ctx.restore();

      simView = { cx: cx, cy: cy, scale: scale };
      ctx.fillStyle = '#5ec8ff'; ctx.font = 'bold 12px Segoe UI,sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(simPlaying ? 'LIVE PREVIEW' : 'PAUSED', 14, 22);
      if (liveMod && liveMod.name) { ctx.fillStyle = '#e8eef8'; ctx.font = '11px Segoe UI,sans-serif'; ctx.fillText(liveMod.name, 14, 38); }
      const badge = document.getElementById('parityBadge');
      if (badge && liveMod) {
        const p = liveMod.physics || {};
        badge.textContent = 'v' + liveMod.schemaVersion + ' · μ ' + Number(p.tableFriction != null ? p.tableFriction : 0.35).toFixed(2)
          + '/' + Number(p.restitutionScale != null ? p.restitutionScale : 1).toFixed(2)
          + ' · #' + String(liveMod.hash || '—').slice(0, 8)
          + (lastExportedHash && liveMod.hash !== lastExportedHash ? ' · dirty' : '');
      }
    }

    function updatePreviewStats(mod) {
      const p = (mod && mod.physics) || {};
      const n = (mod && mod.level && mod.level.coins && mod.level.coins.length) || 0;
      const size = mod && mod.level ? (mod.level.width + '×' + mod.level.height) : '—';
      const errs = mod ? validateMod(mod) : [];
      previewStats.innerHTML =
        '<strong>level</strong> ' + size + ' · <strong>objects</strong> ' + n +
        '<br><strong>μ</strong> ' + (p.tableFriction != null ? Number(p.tableFriction).toFixed(2) : '0.35') +
        ' · aim ' + (p.aimPowerScale != null ? Number(p.aimPowerScale).toFixed(2) : '1.00') +
        ' · <strong>pipelines</strong> ' + ((mod && mod.pipelines && mod.pipelines.length) || 0) +
        ' · <strong>win</strong> ' + ((mod && mod.win && mod.win.map(function (w) { return w.type; }).join(', ')) || '—') +
        (errs.length ? '<br><span style="color:#ff8a8a">⚠ ' + errs.join('; ') + '</span>' : '');
    }

    function dispatchLive(mod) {
      const prevHash = liveMod && liveMod.hash;
      liveMod = mod;
      if (!simBodies.length || !prevHash || prevHash !== mod.hash) resetSimFromMod(mod);
      drawPreview();
      updatePreviewStats(mod);
      try { localStorage.setItem(WS_AUTOSAVE_KEY, JSON.stringify(Blockly.serialization.workspaces.save(workspace))); } catch (_) {}
      const payload = { type: 'CoinDuel:modConfig', mod: mod, modJson: JSON.stringify(mod), hash: mod.hash || null, at: Date.now() };
      try {
        if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
        window.dispatchEvent(new CustomEvent('CoinDuel:modConfig', { detail: payload }));
      } catch (_) {}
    }

    function scheduleLive() {
      if (liveTimer) clearTimeout(liveTimer);
      liveTimer = setTimeout(function () {
        liveTimer = null;
        try { dispatchLive(workspaceToMod(workspace)); }
        catch (_) {}
      }, 80);
    }

    function isLiveEvent(e) {
      if (!e || e.isUiEvent) return false;
      var t = String(e.type || '');
      return /create|delete|change|move/i.test(t)
        || t === Blockly.Events.BLOCK_CHANGE
        || t === Blockly.Events.BLOCK_CREATE
        || t === Blockly.Events.BLOCK_DELETE
        || t === Blockly.Events.BLOCK_MOVE;
    }

    Blockly.defineBlocksWithJsonArray(DEFS);
    const workspace = Blockly.inject('workspace', {
      toolbox: TOOLBOX,
      media: 'https://unpkg.com/blockly@10.4.3/media/',
      trashcan: true,
      scrollbars: true,
      zoom: { controls: true, wheel: true, startScale: 0.9, maxScale: 2, minScale: 0.4 },
      grid: { spacing: 24, length: 3, colour: '#333', snap: true },
      move: { scrollbars: true, drag: true, wheel: true },
      renderer: 'zelos',
    });

    workspace.addChangeListener(function (e) {
      if (isLiveEvent(e)) scheduleLive();
    });

    // Starter stack
    (() => {
      const hat = workspace.newBlock('when_coin_hit');
      hat.initSvg(); hat.render(); hat.moveBy(40, 40);
      const fx = workspace.newBlock('spawn_world_text');
      fx.initSvg(); fx.render();
      fx.previousConnection.connect(hat.nextConnection);
      const shake = workspace.newBlock('screen_shake');
      shake.initSvg(); shake.render();
      shake.previousConnection.connect(fx.nextConnection);
      const phys = workspace.newBlock('config_physics');
      phys.initSvg(); phys.render(); phys.moveBy(420, 40);
      const setup = workspace.newBlock('level_setup');
      setup.initSvg(); setup.render(); setup.moveBy(420, 120);
      const place1 = workspace.newBlock('level_place');
      place1.initSvg(); place1.render(); place1.moveBy(420, 180);
      place1.setFieldValue('striker', 'KIND');
      place1.setFieldValue(-120, 'X');
      const place2 = workspace.newBlock('level_place');
      place2.initSvg(); place2.render(); place2.moveBy(420, 240);
      place2.setFieldValue('target', 'KIND');
      place2.setFieldValue(100, 'X');
    })();

    function resize() {
      Blockly.svgResize(workspace);
      resizePreview();
    }
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(document.getElementById('workspace'));
    new ResizeObserver(resizePreview).observe(document.getElementById('previewWrap'));
    let lastTick = performance.now();
    requestAnimationFrame(function tick(now) {
      const dt = Math.min(0.033, (now - lastTick) / 1000 || 0.016);
      lastTick = now;
      stepSim(dt);
      drawPreview();
      requestAnimationFrame(tick);
    });
    scheduleLive();

    document.getElementById('btnPrevPlay').onclick = function () { simPlaying = true; };
    document.getElementById('btnPrevPause').onclick = function () { simPlaying = false; };
    document.getElementById('btnPrevReset').onclick = function () { resetSimFromMod(liveMod); simPlaying = true; };

    function loadCdnCatalog() {
      const el = document.getElementById('memeCatalog');
      el.textContent = 'Loading CDN memes…';
      fetch(CDN_MANIFEST).then(function (r) { return r.json(); }).then(function (man) {
        const base = (man.baseUrl || CDN_MANIFEST.replace(/\/[^/]*$/, '/'));
        const memeItem = (man.items || []).find(function (i) { return i.kind === 'meme' && String(i.filename).indexOf('index') >= 0; })
          || (man.items || []).find(function (i) { return i.kind === 'meme'; });
        const memeUrl = man.memeConfig ? (base + man.memeConfig) : (memeItem ? base + memeItem.filename : base + 'memes/index.json');
        return fetch(memeUrl).then(function (r) { return r.json(); }).then(function (idx) {
          const list = Array.isArray(idx) ? idx : (idx.memes || idx.items || []);
          const ids = [];
          el.innerHTML = '<strong style="color:#5ec8ff">CDN memes</strong> ';
          list.forEach(function (m) {
            const id = m.id || m.memeId || m.name;
            if (!id) return;
            ids.push(String(id));
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = id;
            btn.style.cssText = 'margin:2px;padding:2px 6px;font-size:0.7rem;';
            btn.onclick = function () {
              const tops = workspace.getTopBlocks(true);
              let target = null;
              for (const t of tops) {
                if (t.type === 'level_place' && t.getFieldValue('KIND') !== 'striker') { target = t; break; }
              }
              if (!target) {
                target = workspace.newBlock('level_place');
                target.initSvg(); target.render(); target.moveBy(420, 300);
                target.setFieldValue('target', 'KIND');
              }
              target.setFieldValue(String(id), 'MEME');
              scheduleLive();
              setStatus('Applied memeId ' + id + ' to a place block.', 'ok');
            };
            el.appendChild(btn);
            // warm atlas
            const tex = m.textures && (m.textures.default || m.textures.idle);
            if (tex) {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = function () { memeAtlas[String(id)] = img; };
              img.src = tex.indexOf('http') === 0 ? tex : (base + tex);
            }
          });
          window.__cdnMemeIds = ids;
          if (!ids.length) el.textContent = 'CDN catalog empty — check manifest.';
        });
      }).catch(function () {
        el.textContent = 'CDN unreachable (offline ok). Meme picker disabled.';
      });
    }
    loadCdnCatalog();

    // Deep link ?mod= / ?modUrl= + autosave restore
    (function bootFromQuery() {
      try {
        const q = new URLSearchParams(location.search);
        const modCode = q.get('mod');
        if (modCode && modCode.indexOf('COINMOD1:') === 0) {
          const mod = fromShare(decodeURIComponent(modCode));
          if (mod) {
            document.getElementById('io').value = JSON.stringify(mod, null, 2);
            document.getElementById('modName').value = mod.name || 'Blockly Mode';
            if (mod.uiStrings) {
              if (mod.uiStrings.win) document.getElementById('uiWin').value = mod.uiStrings.win;
              if (mod.uiStrings.lose) document.getElementById('uiLose').value = mod.uiStrings.lose;
            }
            rebuildWorkspaceFromMod(mod);
            scheduleLive();
            setStatus('Loaded mod from ?mod= deep link.', 'ok');
            return;
          }
        }
        const saved = localStorage.getItem(WS_AUTOSAVE_KEY);
        if (saved) {
          Blockly.serialization.workspaces.load(JSON.parse(saved), workspace);
          scheduleLive();
          setStatus('Restored autosaved workspace.', 'ok');
        }
      } catch (_) {}
    })();

    function rebuildWorkspaceFromMod(mod) {
      workspace.clear();
      var x = 40, y = 40;
      if (mod.physics) {
        var phys = workspace.newBlock('config_physics');
        phys.initSvg(); phys.render(); phys.moveBy(420, 40);
        phys.setFieldValue(mod.physics.tableFriction != null ? mod.physics.tableFriction : 0.35, 'FRICTION');
        phys.setFieldValue(mod.physics.restitutionScale != null ? mod.physics.restitutionScale : 1, 'RESTITUTION');
        phys.setFieldValue(mod.physics.enableTimeReversePenalty === false ? 'false' : 'true', 'TIME_REVERSE');
        if (phys.getField('AIM')) phys.setFieldValue(mod.physics.aimPowerScale != null ? mod.physics.aimPowerScale : 1, 'AIM');
      }
      if (mod.uiStrings) {
        if (mod.uiStrings.win && document.getElementById('uiWin')) document.getElementById('uiWin').value = mod.uiStrings.win;
        if (mod.uiStrings.lose && document.getElementById('uiLose')) document.getElementById('uiLose').value = mod.uiStrings.lose;
      }
      (mod.win || []).forEach(function (w, i) {
        var t = w.type === 'REACH_TARGET_SCORE' ? 'config_win_score'
          : w.type === 'SURVIVE_TIME_LIMIT' ? 'config_win_survive'
          : w.type === 'KNOCK_OUT_BOSS_COIN' ? 'config_win_boss' : 'config_win_clear_all';
        var b = workspace.newBlock(t);
        b.initSvg(); b.render(); b.moveBy(420, 100 + i * 50);
        if (t === 'config_win_score') b.setFieldValue(w.value || 100, 'SCORE');
        if (t === 'config_win_survive') b.setFieldValue(w.value || 60, 'SEC');
        if (t === 'config_win_boss') b.setFieldValue(w.value || 'boss', 'TAG');
      });
      (mod.lose || []).forEach(function (l, i) {
        var t = l.type === 'SHOT_LIMIT' ? 'config_lose_shot_limit'
          : l.type === 'TIMER_EXPIRED' ? 'config_lose_timer' : 'config_lose_striker_fall';
        var b = workspace.newBlock(t);
        b.initSvg(); b.render(); b.moveBy(420, 260 + i * 50);
        if (t === 'config_lose_shot_limit') b.setFieldValue(l.value || 10, 'COUNT');
        if (t === 'config_lose_timer') b.setFieldValue(l.value || 90, 'SEC');
      });
      if (mod.physics && Blockly.Blocks['config_physics']) {
        /* aim field set above when phys block created */
      }
      if (mod.level) {
        var setup = workspace.newBlock('level_setup');
        setup.initSvg(); setup.render(); setup.moveBy(x, y);
        setup.setFieldValue(mod.level.id || 1, 'ID');
        setup.setFieldValue(mod.level.width || 800, 'WIDTH');
        setup.setFieldValue(mod.level.height || 600, 'HEIGHT');
        setup.setFieldValue((mod.level.wall && mod.level.wall.thickness) || 64, 'WALL');
        y += 60;
        if (mod.level.table) {
          var ts = workspace.newBlock('level_table_skin');
          ts.initSvg(); ts.render(); ts.moveBy(x, y);
          if (mod.level.table.felt) ts.setFieldValue(mod.level.table.felt, 'FELT');
          if (mod.level.table.wall) ts.setFieldValue(mod.level.table.wall, 'WALL');
          y += 50;
        }
        (mod.level.coins || []).forEach(function (c) {
          var kind = 'target';
          if (c.type === 'bomb') kind = 'bomb';
          else if (c.type === 'block') kind = 'block';
          else if (c.type === 'mud') kind = 'mud';
          else if (c.canshot !== false && !(c.behaviors && c.behaviors[0])) kind = 'striker';
          else if (c.behaviors && String(c.behaviors[0]).indexOf('Knock') >= 0) kind = 'knockback';
          else if (c.behaviors && String(c.behaviors[0]).indexOf('Freeze') >= 0) kind = 'freeze';
          else if (c.behaviors && String(c.behaviors[0]).indexOf('Flash') >= 0) kind = 'flash';
          var b = workspace.newBlock('level_place');
          b.initSvg(); b.render(); b.moveBy(x, y);
          b.setFieldValue(kind, 'KIND');
          b.setFieldValue(c.x || 0, 'X');
          b.setFieldValue(c.y || 0, 'Y');
          b.setFieldValue(c.radius || 32, 'RADIUS');
          b.setFieldValue(c.class || 1, 'CLASS');
          if (c.skinKey) b.setFieldValue(c.skinKey, 'SKIN');
          if (c.skin && c.skin.default) b.setFieldValue(String(c.skin.default), 'URL');
          if (c.memeId) b.setFieldValue(c.memeId, 'MEME');
          if (c.friction != null) b.setFieldValue(c.friction, 'FRICTION');
          y += 56;
          if (y > 480) { y = 40; x += 520; }
        });
      }
      // Rebuild simple event stacks from pipelines (best-effort)
      var px = 40, py = 40;
      if (mod.level) { px = 40; py = Math.min(y + 40, 40); }
      (mod.pipelines || []).forEach(function (pipe, pi) {
        var typeMap = {
          WHEN_GAME_START: 'when_game_start', WHEN_COIN_HIT: 'when_coin_hit', WHEN_SHOT_FIRED: 'when_shot_fired',
          WHEN_CUSHION_BOUNCE: 'when_cushion_bounce', WHEN_FOUL_TRIGGERED: 'when_foul_triggered',
          WHEN_POWER_CHARGED: 'when_power_charged', WHEN_TIMER_TICK: 'when_timer_tick',
          IF_VELOCITY_GREATER_THAN: 'if_velocity_gt', IF_PROBABILITY: 'if_probability', IF_COIN_TAG: 'if_coin_tag',
          APPLY_IMPULSE: 'apply_impulse', EXPLODE_RADIUS: 'explode_radius', SET_COIN_POSITION: 'set_coin_position',
          SWAP_POSITIONS: 'swap_positions', SPAWN_WORLD_TEXT: 'spawn_world_text', SCREEN_SHAKE: 'screen_shake',
          PLAY_MEME_SOUND: 'play_meme_sound', DECLARE_WIN: 'declare_win', DECLARE_LOSE: 'declare_lose'
        };
        var hatType = typeMap[pipe.event];
        if (!hatType || !Blockly.Blocks[hatType]) return;
        var prev = workspace.newBlock(hatType);
        prev.initSvg(); prev.render();
        prev.moveBy(px + (pi % 2) * 280, py + Math.floor(pi / 2) * 220);
        if (pipe.eventProps) {
          if (pipe.eventProps.percent != null && prev.getField('PERCENT')) prev.setFieldValue(pipe.eventProps.percent, 'PERCENT');
          if (pipe.eventProps.interval != null && prev.getField('INTERVAL')) prev.setFieldValue(pipe.eventProps.interval, 'INTERVAL');
        }
        (pipe.steps || []).forEach(function (step) {
          var st = typeMap[step.opcode];
          if (!st || !Blockly.Blocks[st]) return;
          var nb = workspace.newBlock(st);
          nb.initSvg(); nb.render();
          var props = step.props || {};
          if (st === 'apply_impulse') { if (props.x != null) nb.setFieldValue(props.x, 'X'); if (props.y != null) nb.setFieldValue(props.y, 'Y'); }
          if (st === 'explode_radius') { if (props.force != null) nb.setFieldValue(props.force, 'FORCE'); if (props.radius != null) nb.setFieldValue(props.radius, 'RADIUS'); }
          if (st === 'set_coin_position') { if (props.x != null) nb.setFieldValue(props.x, 'X'); if (props.y != null) nb.setFieldValue(props.y, 'Y'); }
          if (st === 'spawn_world_text') { if (props.text) nb.setFieldValue(props.text, 'TEXT'); if (props.color) nb.setFieldValue(props.color, 'COLOR'); }
          if (st === 'screen_shake') { if (props.intensity != null) nb.setFieldValue(props.intensity, 'INTENSITY'); if (props.duration != null) nb.setFieldValue(props.duration, 'DURATION'); }
          if (st === 'if_velocity_gt' && props.value != null) nb.setFieldValue(props.value, 'VALUE');
          if (st === 'if_probability' && props.percent != null) nb.setFieldValue(props.percent, 'PERCENT');
          try { nb.previousConnection.connect(prev.nextConnection); } catch (_) {}
          prev = nb;
        });
      });
    }

    function exportShareCode(copyClipboard) {
      const mod = workspaceToMod(workspace);
      const errs = validateMod(mod);
      let code = '';
      try {
        code = toShare(mod);
      } catch (e) {
        setStatus('Share encode failed (code too large?). Remove Base64 URLs from place blocks.', 'err');
        return null;
      }
      document.getElementById('io').value = code;
      lastExportedHash = mod.hash || '';
      try { localStorage.setItem('CoinDuel:activeMod', JSON.stringify(mod)); } catch (_) {}
      const warn = errs.length ? ' ⚠ ' + errs.join('; ') : '';
      if (copyClipboard) {
        navigator.clipboard.writeText(code).then(function () {
          setStatus('Copied COINMOD1 (' + code.length + ' chars).' + warn, errs.length ? 'err' : 'ok');
        }).catch(function () {
          setStatus('COINMOD1 in box — clipboard blocked.' + warn, 'err');
        });
      } else {
        setStatus('Exported COINMOD1 (' + code.length + ' chars).' + warn, errs.length ? 'err' : 'ok');
      }
      return code;
    }
    document.getElementById('btnExportShare').onclick = function () { exportShareCode(false); };
    document.getElementById('btnCopyShare').onclick = function () { exportShareCode(true); };
    document.getElementById('btnOpenRuntime').onclick = function () {
      const code = exportShareCode(true);
      if (!code) return;
      const url = RUNTIME_URL + (RUNTIME_URL.indexOf('?') >= 0 ? '&' : '?') + 'mod=' + encodeURIComponent(code);
      if (code.length > 1800) {
        setStatus('Share code long for URL — copied to clipboard; paste via runtime Load or shorten level skins.', 'err');
      }
      window.open(url, '_blank');
    };
    document.getElementById('btnExportJson').onclick = () => {
      const mod = workspaceToMod(workspace);
      document.getElementById('io').value = JSON.stringify(mod, null, 2);
      setStatus('Exported ModConfig JSON' + (mod.level ? ' (includes level)' : '') + '.', 'ok');
    };
    document.getElementById('btnExportLevel').onclick = () => {
      const mod = workspaceToMod(workspace);
      const level = mod.level || { id: 1, width: 800, height: 600, wall: { thickness: 64 }, coins: [] };
      document.getElementById('io').value = JSON.stringify(level, null, 2);
      setStatus('Exported Level JSON (' + (level.coins || []).length + ' objects) — save as levels/' + level.id + '.json', 'ok');
    };
    document.getElementById('btnCopyJson').onclick = async () => {
      const mod = workspaceToMod(workspace);
      const text = JSON.stringify(mod, null, 2);
      document.getElementById('io').value = text;
      try { await navigator.clipboard.writeText(text); setStatus('JSON copied to clipboard.', 'ok'); }
      catch { setStatus('JSON in box — clipboard blocked.', 'err'); }
    };
    document.getElementById('btnExportWs').onclick = () => {
      const state = JSON.stringify(Blockly.serialization.workspaces.save(workspace));
      document.getElementById('io').value = 'COINWS1:' + compress(state);
      setStatus('Exported compressed workspace string (COINWS1).', 'ok');
    };
    function levelJsonToMod(level) {
      return {
        schemaVersion: 1,
        id: 'mod_level_' + (level.id || 1),
        name: 'Level ' + (level.id || 1),
        version: Date.now(),
        graph: { blocks: [] },
        pipelines: [],
        win: [{ type: 'CLEAR_ALL_COINS' }],
        lose: [{ type: 'STRIKER_FALLS_OFF_TABLE' }],
        physics: { tableFriction: 0.35, restitutionScale: 1, enableTimeReversePenalty: true, aimPowerScale: 1 },
        variables: [],
        level: level,
        assetManifestUrl: CDN_MANIFEST,
        boot: { scene: 'game', autoPlay: true },
      };
    }

    function isLevelJson(obj) {
      return obj && Array.isArray(obj.coins) && (obj.width != null || obj.id != null)
        && obj.schemaVersion == null && !Array.isArray(obj.pipelines);
    }

    function importModIntoEditor(mod, label) {
      if (!mod || mod.schemaVersion !== 1) {
        setStatus('Invalid mod.', 'err');
        return;
      }
      try { localStorage.setItem('CoinDuel:activeMod', JSON.stringify(mod)); } catch (_) {}
      document.getElementById('io').value = JSON.stringify(mod, null, 2);
      document.getElementById('modName').value = mod.name || 'Blockly Mode';
      rebuildWorkspaceFromMod(mod);
      scheduleLive();
      const n = (mod.level && mod.level.coins && mod.level.coins.length) || 0;
      setStatus((label || 'Imported') + ' — ' + n + ' objects as Level blocks.', 'ok');
    }

    document.getElementById('btnImportShare').onclick = () => {
      const raw = document.getElementById('io').value.trim();
      if (raw.startsWith('COINWS1:')) {
        const payload = decompress(raw.slice(8));
        if (!payload) { setStatus('Workspace decompress failed.', 'err'); return; }
        try {
          workspace.clear();
          Blockly.serialization.workspaces.load(JSON.parse(payload), workspace);
          setStatus('Workspace imported.', 'ok');
        } catch (e) { setStatus('Workspace import failed: ' + e.message, 'err'); }
        return;
      }
      if (raw.startsWith('COINMOD1:')) {
        const mod = fromShare(raw);
        if (!mod) { setStatus('Invalid COINMOD1 code.', 'err'); return; }
        importModIntoEditor(mod, 'Imported COINMOD1');
        return;
      }
      try {
        const data = JSON.parse(raw);
        if (isLevelJson(data)) {
          importModIntoEditor(levelJsonToMod(data), 'Imported Level JSON');
          return;
        }
        if (data.schemaVersion === 1 && data.level) {
          importModIntoEditor(data, 'Imported ModConfig');
          return;
        }
        if (data.schemaVersion === 1) {
          localStorage.setItem('CoinDuel:activeMod', JSON.stringify(data));
          setStatus('ModConfig saved (no level to rebuild).', 'ok');
          return;
        }
        throw new Error('unrecognized');
      } catch {
        setStatus('Paste Level JSON (1.json), COINMOD1:, COINWS1:, or ModConfig.', 'err');
      }
    };

    document.getElementById('btnLoadLevel1').onclick = function () {
      const base = CDN_MANIFEST.replace(/\/[^/]*$/, '/');
      const url = base + 'levels/1.json';
      setStatus('Loading Level 1 from CDN…');
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (level) {
        importModIntoEditor(levelJsonToMod(level), 'Loaded Level 1');
      }).catch(function (e) {
        setStatus('Load Level 1 failed: ' + e.message + ' — paste cdn/levels/1.json then Import.', 'err');
      });
    };
    document.getElementById('btnClear').onclick = () => {
      workspace.clear();
      setStatus('Workspace cleared.');
    };
  </script>
</body>
</html>
